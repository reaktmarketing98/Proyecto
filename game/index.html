<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tumble Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #8fd3ff;
    --panel: #ffffff;
    --ink: #2b2350;
    --muted: #7a74a0;
    --pink: #ff5fa2;
    --yellow: #ffd23f;
    --blue: #4fc3ff;
    --green: #4fd67a;
    --purple: #8b5cff;
    --red: #ff4d5e;
    --shadow: #d9d2f5;
  }
  /* El juego usa siempre su paleta de colores alegre */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #8fd3ff; --ink: #2b2350; } }
  :root[data-theme="dark"] { --bg: #8fd3ff; --ink: #2b2350; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: Fredoka, "Trebuchet MS", system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { display: block; }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ---------- Pantallas ---------- */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px;
    background: linear-gradient(180deg, rgba(139,92,255,0.25), rgba(255,95,162,0.25)); overflow-y: auto; }
  .panel { width: min(460px, 100%); background: var(--panel); border-radius: 28px; padding: 26px 22px 22px; text-align: center;
    box-shadow: 0 8px 0 var(--shadow), 0 20px 50px rgba(43,35,80,0.25); margin: auto; }
  .logo { font-size: clamp(44px, 12vw, 62px); font-weight: 700; line-height: 0.95; letter-spacing: 0.01em; text-shadow: 0 4px 0 rgba(43,35,80,0.15); }
  .logo span:nth-child(1) { color: var(--pink); } .logo span:nth-child(2) { color: var(--purple); }
  .tagline { color: var(--muted); font-size: 16px; margin: 10px 0 18px; line-height: 1.45; }
  .h2 { font-size: 28px; font-weight: 700; color: var(--purple); margin-bottom: 4px; }
  input.name { width: 100%; padding: 14px 16px; border-radius: 16px; border: 3px solid #e7e2fb; background: #f7f5ff;
    color: var(--ink); font-size: 18px; outline: none; text-align: center; font-family: inherit; font-weight: 600; }
  input.name:focus { border-color: var(--purple); }
  .btn { margin-top: 12px; width: 100%; padding: 15px; border: 0; border-radius: 18px; cursor: pointer; font-size: 22px; font-weight: 700;
    color: #fff; background: var(--green); box-shadow: 0 6px 0 #2fa957; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2fa957; }
  .btn.ghost { background: #f1eefc; color: var(--purple); box-shadow: 0 5px 0 var(--shadow); font-size: 17px; }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--shadow); }
  .btn.small { font-size: 15px; padding: 11px; border-radius: 14px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .mode { cursor: pointer; border: 0; border-radius: 22px; padding: 18px 10px 16px; color: #fff; display: flex; flex-direction: column;
    align-items: center; gap: 6px; transition: transform .1s; }
  .mode:hover { transform: translateY(-3px) scale(1.02); }
  .mode:active { transform: translateY(3px); }
  .mode.solo { background: linear-gradient(180deg, #ffb13f, #ff7a3f); box-shadow: 0 7px 0 #d9582a; }
  .mode.multi { background: linear-gradient(180deg, #5fb8ff, #6f6bff); box-shadow: 0 7px 0 #4a46c9; }
  .mode b { font-size: 22px; }
  .mode small { font-size: 13px; opacity: 0.95; line-height: 1.3; }
  .mode .ico { font-size: 40px; line-height: 1; }
  .langs { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .lang { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 12px; font-weight: 600; font-size: 14px; background: #f1eefc; color: var(--muted); }
  .lang.on { background: var(--purple); color: #fff; }
  .controls { margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; font-size: 14px; color: var(--muted); }
  .key { font-weight: 700; font-size: 12px; color: var(--purple); background: #f1eefc; border-radius: 8px; padding: 3px 9px; text-align: center; }
  .diffs { display: flex; flex-direction: column; gap: 12px; margin: 14px 0 4px; }
  .diff { cursor: pointer; border: 0; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left; color: #fff; transition: transform .1s; }
  .diff:hover { transform: translateY(-2px); }
  .diff:active { transform: translateY(3px); }
  .diff b { font-size: 22px; display: block; }
  .diff small { font-size: 13px; opacity: 0.95; }
  .diff .stars { font-size: 22px; letter-spacing: 2px; min-width: 76px; }
  .diff.easy { background: #4fd67a; box-shadow: 0 6px 0 #2fa957; }
  .diff.normal { background: #ffb13f; box-shadow: 0 6px 0 #d98a1f; }
  .diff.hard { background: #ff4d5e; box-shadow: 0 6px 0 #c92c3d; }
  .hall-status { font-size: 14px; color: var(--muted); margin: 6px 0 14px; }
  .notice { font-size: 15px; color: var(--ink); line-height: 1.5; background: #fff6d6; border-radius: 16px; padding: 14px; margin-bottom: 6px; }
  .group { border-radius: 20px; background: #f7f5ff; padding: 14px; text-align: left; }
  .group-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .code { font-size: 30px; font-weight: 700; color: var(--purple); letter-spacing: 0.18em; background: #fff; border-radius: 12px; padding: 2px 12px; }
  .group-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .group-list div { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; padding: 8px 12px; background: #fff; border-radius: 12px; }
  .group-list .tag { font-size: 12px; background: var(--yellow); color: #7a5a00; border-radius: 8px; padding: 2px 8px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; margin-top: 0 !important; }
  input.name.small { font-size: 16px; padding: 10px; text-transform: uppercase; letter-spacing: 0.25em; }
  .msg { font-size: 14px; color: var(--pink); min-height: 18px; margin-top: 8px; font-weight: 600; }
  .search { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bounce { font-size: 40px; animation: bounce .7s ease-in-out infinite alternate; }
  @keyframes bounce { to { transform: translateY(-12px) rotate(10deg); } }
  .search-text { font-size: 16px; font-weight: 600; color: var(--ink); }
  @media (max-width: 420px) { .modes { grid-template-columns: 1fr; } }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .bubble { background: rgba(255,255,255,0.92); border-radius: 18px; box-shadow: 0 5px 0 rgba(43,35,80,0.15); }
  .warn { position: absolute; inset: 0; box-shadow: inset 0 0 0 rgba(255,77,94,0); transition: box-shadow .4s; }
  .warn.on { box-shadow: inset 0 0 120px rgba(255,77,94,0.45); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 180px rgba(255,77,94,0.6); } }
  .fade { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .cross { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #fff; border: 2px solid var(--purple); }
  .top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .pill { padding: 6px 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .pill .lbl { font-size: 13px; color: var(--muted); }
  .pill .val { font-size: 26px; color: var(--purple); }
  .levels { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .levels .lbl { font-size: 11px; color: var(--muted); font-weight: 700; }
  .lvl { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    color: #fff; opacity: 0.35; transition: all .25s; border: 3px solid #fff; }
  .lvl.on { opacity: 1; transform: scale(1.25); box-shadow: 0 0 0 3px rgba(43,35,80,0.15); }
  .dj { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 8px 18px; display: flex; gap: 10px; align-items: center; }
  .dj .lbl { font-size: 13px; color: var(--muted); font-weight: 700; }
  .charge { font-size: 26px; line-height: 1; color: #e3def7; transition: all .2s; }
  .charge.on { color: var(--yellow); text-shadow: 0 2px 0 #e0a800; transform: scale(1.1); }
  .feed { position: absolute; right: 14px; top: 14px; width: min(280px, 46vw); display: flex; flex-direction: column; gap: 6px; }
  .feed div { padding: 7px 12px; font-size: 14px; font-weight: 600; animation: feedIn .25s ease-out; }
  .feed .e { color: #d39a00; } .feed .x { color: var(--red); } .feed .w { color: var(--purple); }
  @keyframes feedIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  .center-msg { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(56px, 16vw, 130px); font-weight: 700;
    color: #fff; -webkit-text-stroke: 3px var(--purple); text-shadow: 0 8px 0 rgba(43,35,80,0.25); white-space: nowrap; }
  .center-msg.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .banner { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); padding: 16px 24px; text-align: center; pointer-events: auto; }
  .banner .big { font-size: 30px; font-weight: 700; color: var(--red); }
  .banner .small { color: var(--muted); font-size: 15px; margin: 4px 0 6px; font-weight: 500; }
  .banner .btn { font-size: 16px; padding: 10px; }
  .hint { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--muted); padding: 6px 14px; white-space: nowrap; font-weight: 600; }
  .sound { position: absolute; right: 14px; bottom: 18px; padding: 8px 12px; font-size: 13px; color: var(--muted); pointer-events: auto; cursor: pointer; font-weight: 700; border: 0; }

  /* ---------- Resultados ---------- */
  .place { font-size: 96px; font-weight: 700; line-height: 1; color: var(--purple); }
  .place.win { color: var(--yellow); -webkit-text-stroke: 3px #e0a800; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 6px; }
  .stat { padding: 12px 6px; border-radius: 16px; background: #f7f5ff; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--purple); }
  .stat .l { font-size: 12px; color: var(--muted); font-weight: 600; }
  .rank { text-align: left; margin-top: 12px; font-size: 15px; max-height: 190px; overflow: auto; font-weight: 600; }
  .rank div { display: flex; justify-content: space-between; padding: 6px 12px; border-radius: 12px; }
  .rank div.me { background: #fff1c7; }

  /* ---------- Táctil ---------- */
  #touch { position: fixed; inset: 0; z-index: 11; pointer-events: none; }
  .stick { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.2); transform: translate(-50%, -50%); }
  .stick .nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
  .jump-btn { position: absolute; right: 26px; bottom: 90px; width: 92px; height: 92px; border-radius: 50%; pointer-events: auto; border: 0;
    background: var(--green); box-shadow: 0 6px 0 #2fa957; color: #fff; font-weight: 700; font-size: 16px; }

  @media (max-width: 600px) {
    .levels { top: auto; bottom: 86px; transform: none; }
    .lvl { width: 22px; height: 22px; font-size: 11px; }
    .pill .val { font-size: 20px; }
    .feed { top: 64px; }
    .sound { bottom: auto; top: 64px; left: 14px; right: auto; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<!-- Inicio -->
<div id="start" class="screen">
  <div class="panel">
    <div class="logo"><span>Tumble</span> <span>Tiles</span></div>
    <p class="tagline" data-i18n="tagline"></p>
    <input id="nameInput" class="name" maxlength="14" data-i18n-ph="namePh" value="">
    <div class="modes">
      <button id="modeSolo" class="mode solo"><span class="ico">🎮</span><b data-i18n="solo"></b><small data-i18n="soloDesc"></small></button>
      <button id="modeMulti" class="mode multi"><span class="ico">🌍</span><b data-i18n="multi"></b><small data-i18n="multiDesc"></small></button>
    </div>
    <div class="controls">
      <span class="key">WASD</span><span data-i18n="ctrlMove"></span>
      <span class="key" data-i18n="keySpace"></span><span data-i18n="ctrlJump"></span>
      <span class="key" data-i18n="keyMouse"></span><span data-i18n="ctrlLook"></span>
      <span class="key">⭐</span><span data-i18n="ctrlStar"></span>
    </div>
    <div class="langs" id="langs"></div>
  </div>
</div>

<!-- Un jugador: dificultad -->
<div id="diffScreen" class="screen hidden">
  <div class="panel">
    <div class="h2" data-i18n="chooseDiff"></div>
    <div class="diffs">
      <button class="diff easy" data-d="easy"><span class="stars">★☆☆</span><span><b data-i18n="easy"></b><small data-i18n="easyDesc"></small></span></button>
      <button class="diff normal" data-d="normal"><span class="stars">★★☆</span><span><b data-i18n="normal"></b><small data-i18n="normalDesc"></small></span></button>
      <button class="diff hard" data-d="hard"><span class="stars">★★★</span><span><b data-i18n="hard"></b><small data-i18n="hardDesc"></small></span></button>
    </div>
    <button class="btn ghost back" data-i18n="back"></button>
  </div>
</div>

<!-- Multijugador -->
<div id="hall" class="screen hidden">
  <div class="panel">
    <div class="h2" data-i18n="multi"></div>
    <div id="hallStatus" class="hall-status"></div>
    <div id="hallOff" class="notice hidden" data-i18n="offline"></div>
    <div id="hallOn" class="hidden">
      <div class="group">
        <div class="group-head"><span data-i18n="yourGroup"></span><span class="code" id="groupCode">····</span></div>
        <div id="groupList" class="group-list"></div>
        <div class="row">
          <button id="copyInvite" class="btn ghost small" data-i18n="invite"></button>
          <button id="leaveGroup" class="btn ghost small hidden" data-i18n="leave"></button>
        </div>
        <div class="row">
          <input id="joinCode" class="name small" maxlength="4" data-i18n-ph="codePh" autocomplete="off">
          <button id="joinBtn" class="btn ghost small" data-i18n="join"></button>
        </div>
        <div id="groupMsg" class="msg"></div>
      </div>
      <button id="searchBtn" class="btn" data-i18n="play"></button>
      <div id="searchBox" class="search hidden">
        <div class="bounce">🟣</div>
        <div id="searchText" class="search-text"></div>
        <button id="cancelSearch" class="btn ghost small" data-i18n="cancel"></button>
      </div>
    </div>
    <button class="btn ghost back" data-i18n="back"></button>
  </div>
</div>

<!-- Resultados -->
<div id="results" class="screen hidden">
  <div class="panel">
    <div id="resTitle" style="color:var(--muted);font-size:18px;font-weight:600"></div>
    <div id="resPlace" class="place">#1</div>
    <div id="resSub" style="font-size:17px;color:var(--muted);font-weight:600"></div>
    <div class="stats">
      <div class="stat"><div id="resTime" class="v">0:00</div><div class="l" data-i18n="survived"></div></div>
      <div class="stat"><div id="resTiles" class="v">0</div><div class="l" data-i18n="tilesBroken"></div></div>
      <div class="stat"><div id="resCores" class="v">0</div><div class="l" data-i18n="starsGot"></div></div>
    </div>
    <div id="resRank" class="rank"></div>
    <button id="againBtn" class="btn"></button>
    <button id="menuBtn" class="btn ghost" data-i18n="menu"></button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="warn" class="warn"></div>
  <div id="cross" class="cross"></div>
  <div class="top">
    <div class="pill bubble"><span class="lbl" data-i18n="players"></span><span id="aliveVal" class="val">8</span></div>
    <div class="pill bubble"><span class="lbl" data-i18n="time"></span><span id="timeVal" class="val">0:00</span></div>
  </div>
  <div class="levels bubble" id="levels"><span class="lbl" data-i18n="level"></span></div>
  <div class="dj bubble">
    <span class="lbl" data-i18n="doubleJump"></span>
    <span class="charge" data-g="0">★</span><span class="charge" data-g="1">★</span><span class="charge" data-g="2">★</span>
  </div>
  <div id="feed" class="feed"></div>
  <div id="centerMsg" class="center-msg"></div>
  <div id="hint" class="hint bubble" data-i18n="hint"></div>
  <button id="soundBtn" class="sound bubble"></button>
  <div id="fade" class="fade"></div>
  <div id="banner" class="banner bubble hidden">
    <div class="big" data-i18n="youFell"></div>
    <div id="bannerSub" class="small"></div>
    <button id="toResults" class="btn ghost" data-i18n="seeResults"></button>
  </div>
</div>

<div id="touch" class="hidden">
  <div id="stick" class="stick hidden"><div class="nub"></div></div>
  <button id="jumpBtn" class="jump-btn" data-i18n="jumpBtn"></button>
</div>

<script type="module">

  for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, d = 32 + Math.random() * 60; addCloud(Math.cos(a) * d, 8 - Math.random() * 45, Math.sin(a) * d, 1 + Math.random()); }

function cubeRound(q, r) {
  let x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
const key = (q, r) => q * 1000 + r;
const coords = [];
const index = new Map();
for (let q = -CFG.rings; q <= CFG.rings; q++)
  for (let r = Math.max(-CFG.rings, -q - CFG.rings); r <= Math.min(CFG.rings, -q + CFG.rings); r++) {
    index.set(key(q, r), coords.length);
    coords.push([q, r, CFG.hex * SQ3 * (q + r / 2), CFG.hex * 1.5 * r]);
  }
// textura tipo "botón": centro claro, borde suave y un brillo
const tileTex = (() => {

  g.fillStyle = '#e9e9e9'; g.fillRect(0, 0, 128, 128);

  g.fillStyle = gr; g.beginPath(); g.arc(64, 64, 62, 0, Math.PI * 2); g.fill();

  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
})();
const tileGeo = new THREE.CylinderGeometry(CFG.hex * 0.94, CFG.hex * 0.8, CFG.tileH, 6, 1);

const SEAM_IDLE = new THREE.Color(0.95, 0.95, 0.95);
const SEAM_HOT = new THREE.Color(4, 0.5, 0.45);
const HOT = new THREE.Color(0xff3b4a);
const WHITE = new THREE.Color(0xffffff);

const floors = [];
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();
const tmpM = new THREE.Matrix4();

function buildFloors() {
  for (const f of floors) scene.remove(f.mesh, f.seams);
  floors.length = 0;
  const N = coords.length;
  for (let f = 0; f < CFG.floors; f++) {
    const mesh = new THREE.InstancedMesh(tileGeo, tileMat, N);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const seams = new THREE.InstancedMesh(seamGeo, seamMat, N);
    seams.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const fc = new THREE.Color(FLOOR_COLORS[f]);
    const tiles = coords.map(([q, r, x, z], i) => {
      const base = fc.clone().offsetHSL((Math.random() - 0.5) * 0.02, 0, (Math.random() - 0.5) * 0.06);
      const t = { f, i, x, z, y: floorTop(f) - CFG.tileH / 2, state: 0, t: 0, vy: 0, rx: 0, rz: 0, wx: 0, wz: 0, rot: 0, base };
      setTileMatrix(mesh, seams, t, 0, 0);
      mesh.setColorAt(i, base);
      seams.setColorAt(i, SEAM_IDLE);
      return t;
    });
    mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    seams.instanceColor.setUsage(THREE.DynamicDrawUsage);

    floors.push({ mesh, seams, tiles, dirty: false });

function setTileMatrix(mesh, seams, t, ox, oz, hide, sy = 1) {

  dummy.rotation.set(t.rx, t.rot, t.rz);
  dummy.scale.set(hide ? 0 : 1, hide ? 0 : sy, hide ? 0 : 1);

  seams.setMatrixAt(t.i, tmpM.multiplyMatrices(dummy.matrix, SEAM_LOCAL));

}

const activeTiles = new Set();
let crackSoundAt = 0, fallSoundAt = 0;

  if (t.state !== 0) return;
  t.state = 1; t.t = 0; activeTiles.add(t);

}

  const f = alive[Math.floor(Math.random() * alive.length)].landFloor;
  for (let tries = 0; tries < 40; tries++) {

      const dx = r.pos.x - c.m.position.x, dz = r.pos.z - c.m.position.z, dy = r.pos.y + 0.9 - c.m.position.y;

// zona de pisada pequeña: solo te sostiene lo que está casi bajo tus pies
const FOOT = [[0, 0], [0.12, 0], [-0.12, 0], [0, 0.12], [0, -0.12]];
// ¿hay suelo justo debajo? (para guardar el salto en vez de gastar el doble salto)
function nearGround(r, dist) {
  if (r.vel.y > 0) return false;
  for (let f = 0; f < CFG.floors; f++) {
    const top = floorTop(f);
    if (r.pos.y >= top && r.pos.y - top < dist && tileAt(f, r.pos.x, r.pos.z)) return true;
  }
  return false;
}
function doJump(r) {

}
const SPARK = new THREE.Color(0xfff1a0);
function doDoubleJump(r) {
  r.vel.y = CFG.dJumpV; r.dj--; r.boost = 0.45; r.jumpBuf = 0; puff(r.pos.x, r.pos.y, r.pos.z, SPARK, 8);
  if (r === player) { sfx.dj(); camKick = 1; }
}
// Llamado al pulsar saltar
function requestJump(r) {

  if (r.dj > 0) doDoubleJump(r);
}
let camKick = 0;
const floorFromY = y => Math.min(CFG.floors - 1, Math.max(0, Math.ceil((floorTop(0) - y - 0.5) / CFG.floorGap)));
function stepRunner(r, dt, dirX, dirZ, canBreak) {
  const sp = CFG.speed * (r.bot ? r.spd : 1) * (r.boost > 0 ? 1.28 : 1);
  r.boost -= dt; r.coyote -= dt; r.jumpBuf -= dt;
  // aceleración con inercia (no instantánea)
  const tx = dirX * sp, tz = dirZ * sp;
  const has = dirX !== 0 || dirZ !== 0;
  const acc = r.grounded ? (has ? CFG.accelGround : CFG.decelGround) : CFG.accelAir;
  let ddx = tx - r.vel.x, ddz = tz - r.vel.z; const dl = Math.hypot(ddx, ddz), mx = acc * dt;
  if (dl > mx) { ddx *= mx / dl; ddz *= mx / dl; }

  r.vel.y = Math.max(r.vel.y - CFG.gravity * dt, -34);
  const vyBefore = r.vel.y;
  r.pos.addScaledVector(r.vel, dt);

  const wasGrounded = r.grounded;
  r.grounded = false;
  if (r.vel.y <= 0) {
    for (let f = 0; f < CFG.floors; f++) {
      const top = floorTop(f);
      if (r.pos.y > top + 0.02 || r.pos.y < top - 0.75) continue;
      let any = false;
      for (const [ox, oz] of FOOT) {
        const tl = tileAt(f, r.pos.x + ox, r.pos.z + oz);
        if (tl) { any = true; if (canBreak) trigger(tl, r); }
      }
      if (any) { r.pos.y = top; r.vel.y = 0; r.grounded = true; r.floor = r.landFloor = f; break; }
    }

// Pasos (uno cada medio ciclo de zancada) + animación
function stepFeet(r, dt) {
  const hs = Math.hypot(r.vel.x, r.vel.z);
  r.phase += dt * hs * 2.3;
  const steps = Math.floor(r.phase / Math.PI);
  if (steps !== r.stepCount) {

      if (r === player) sfx.step(0.6 + 0.4 * Math.min(1, hs / CFG.speed), (steps % 2 ? 0.15 : -0.15));

// Jugador que llega por la red: interpolación + rompe las baldosas que pisa
const netTmp = new THREE.Vector3();
function stepRemote(r, dt, canBreak) {
  const s = r.net;

  r.netAge += dt;
  const ex = Math.min(r.netAge, 0.2);
  netTmp.set(s[0] + s[3] * ex, s[7] ? s[1] : s[1] + s[4] * ex, s[2] + s[5] * ex);
  if (r.pos.distanceToSquared(netTmp) > 16) r.pos.copy(netTmp); else r.pos.lerp(netTmp, 1 - Math.exp(-16 * dt));
  r.vel.set(s[3], s[4], s[5]); r.netFacing = s[6];
  const wasG = r.grounded;
  r.grounded = !!s[7]; r.dj = s[9] | 0;
  if (r.grounded) { r.landFloor = r.floor = s[8] | 0; } else r.floor = floorFromY(r.pos.y);

    for (const [ox, oz] of FOOT) { const tl = tileAt(r.landFloor, r.pos.x + ox, r.pos.z + oz); if (tl) trigger(tl, r); }

const r2 = v => Math.round(v * 100) / 100;
const enc = r => [r2(r.pos.x), r2(r.pos.y), r2(r.pos.z), r2(r.vel.x), r2(r.vel.y), r2(r.vel.z), r2(r.mesh.rotation.y), r.grounded ? 1 : 0, r.landFloor, r.dj];
function botStepSound(r, vol) {
  if (!player || !actx) return;
  const d = r.pos.distanceTo(player.pos);

// Animación procedural: piernas que corren, brazos que se balancean, saltitos
function animateChar(r, dt, hs) {
  const m = r.mesh, u = m.userData;
  m.position.copy(r.pos);
  let target = r.facing;
  if (r === player) target = yaw + Math.PI;
  else if (r.kind === 'remote') target = r.netFacing;
  else if (hs > 0.5) target = Math.atan2(r.vel.x, r.vel.z);
  r.facing = target;
  let d = target - m.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
  m.rotation.y += d * Math.min(1, dt * (r === player ? 30 : 10));

  const k = 1 - Math.exp(-14 * dt);
  const run = Math.min(1, hs / CFG.speed);
  r.airPose += ((r.grounded ? 0 : 1) - r.airPose) * (1 - Math.exp(-10 * dt));
  const air = r.airPose, gnd = 1 - air;

  const fx = Math.sin(m.rotation.y), fz = Math.cos(m.rotation.y);
  const fwdAmt = hs > 0.3 ? (r.vel.x * fx + r.vel.z * fz) / hs : 1;
  const dirSign = fwdAmt < -0.3 ? -1 : 1;
  const L = u.legs, A = u.arms;
  for (let i = 0; i < 2; i++) {
    const sg = i ? -1 : 1;
    const swing = sg * s * 0.9 * run * dirSign;
    const bend = Math.max(0, Math.sin(r.phase + (i ? Math.PI : 0) + 1.4)) * 1.1 * run;
    L[i].hip.rotation.x += ((gnd * -swing + air * (i ? 0.4 : -0.6)) - L[i].hip.rotation.x) * k;
    L[i].knee.rotation.x += ((gnd * bend + air * (i ? 0.4 : 0.9)) - L[i].knee.rotation.x) * k;
    // brazos: al correr se balancean, en el aire se levantan contentos
    A[i].sh.rotation.x += ((gnd * swing * 1.1 + air * -0.4) - A[i].sh.rotation.x) * k;
    A[i].sh.rotation.z += (((0.35 + air * 1.6) * (i ? 1 : -1)) - A[i].sh.rotation.z) * k;
  }
  u.torso.rotation.x += ((0.12 * run * gnd * dirSign) - u.torso.rotation.x) * k;
  u.torso.rotation.z = Math.sin(r.phase) * 0.06 * run * gnd;
  u.body.position.y = gnd * Math.abs(Math.cos(r.phase)) * 0.08 * run;
  if (u.spin) u.spin.rotation.y += dt * (6 + hs * 3);
}

// ================== IA DE ROBOTS ==================
const DIRS = 14;
function botBrain(r, dt) {
  r.think -= dt;
  const f = r.floor;
  if (r.think <= 0) {
    r.think = r.thinkBase * (0.6 + Math.random() * 0.8);
    let coreDir = null;
    for (const c of cores) if (c.f === f) {
      const dx = c.m.position.x - r.pos.x, dz = c.m.position.z - r.pos.z, d = Math.hypot(dx, dz);
      if (d < 7 && r.dj < CFG.maxDJ) coreDir = Math.atan2(dx, dz);
    }
    let best = r.heading, bestS = -1e9;
    for (let i = 0; i < DIRS; i++) {
      const a = r.heading + (i / DIRS) * Math.PI * 2;
      const sx = Math.sin(a), sz = Math.cos(a);
      let s = 0;
      for (let d = 1; d <= r.look; d++) {
        const ok = freshAt(f, r.pos.x + sx * d * 0.75, r.pos.z + sz * d * 0.75);
        if (ok) s += (r.look + 1 - d) * 0.7; else if (d <= 2) s -= 6;
      }
      const turn = Math.abs(Math.atan2(Math.sin(a - r.heading), Math.cos(a - r.heading)));
      s -= turn * 1.2;
      if (coreDir !== null) s += Math.max(0, 4 - Math.abs(Math.atan2(Math.sin(a - coreDir), Math.cos(a - coreDir))) * 4);
      const ex = r.pos.x + sx * 3, ez = r.pos.z + sz * 3;
      if (Math.hypot(ex, ez) > ARENA_R * 0.92) s -= 8;
      s += (Math.random() - 0.5) * (1 - r.skill) * 6;
      if (s > bestS) { bestS = s; best = a; }
    }
    r.heading = best;
  }
  const dx = Math.sin(r.heading), dz = Math.cos(r.heading);
  if (r.grounded && !freshAt(f, r.pos.x + dx * 0.8, r.pos.z + dz * 0.8) && freshAt(f, r.pos.x + dx * 2, r.pos.z + dz * 2) && Math.random() < r.skill) doJump(r);
  if (!r.grounded && r.vel.y < -2 && r.dj > 0) {
    for (let fl = 0; fl < CFG.floors; fl++) {
      const top = floorTop(fl);
      if (r.pos.y < top - 0.2 && r.pos.y > top - 1.6) {
        const save = fl === CFG.floors - 1 || r.dj > 1;
        if (save && freshAt(fl, r.pos.x + dx * 2, r.pos.z + dz * 2) && Math.random() < r.rescue) doDoubleJump(r);
      }
    }
  }
  return [dx, dz];
}

function wsRoom() {

async function enterParty(code, lead) {

  NET.partyCode = code; NET.lead = lead; NET.partyTs = Date.now();

// --- Búsqueda rápida ---
// Los grupos que buscan se ordenan por antigüedad; el más antiguo convoca: junta grupos hasta 8

function startSearch() {

  NET.searching = true; NET.searchStart = Date.now();
  NET.party?.presence({ srch: 1 }).catch(() => {});
  lobbyPresence(); refreshHall(); matchmakeTick();
}

  NET.searching = false;
  NET.party?.presence({ srch: 0 }).catch(() => {});
  lobbyPresence(); refreshHall();
}

  if (!NET.room || !NET.searching || NET.inMatch || !amLeader()) return;
  const me = NET.myPeer = myPeerOf(NET.room) || NET.myPeer;
  if (!me) return;
  const lobby = NET.room.peers();
  for (const p of lobby) {
    const pr = p.presence || {};
    if (pr.app === 'tumbletiles' && pr.st === 'host' && Array.isArray(pr.inv) && pr.inv.includes(me) && pr.mid && pr.mid !== NET.lastMid) {
      return goToMatch(pr.mid, false, p.peer);

  }
  const searching = lobby.filter(p => p.presence?.app === 'tumbletiles' && p.presence.st === 'search')
    .sort((a, b) => ((a.presence.ss || 0) - (b.presence.ss || 0)) || (a.peer < b.peer ? -1 : 1));
  const convener = !searching.length || searching[0].peer === me;
  const waited = Date.now() - NET.searchStart;
  if (!convener) {
    const n = searching.reduce((a, p) => a + Math.max(1, p.presence.ps | 0), 0);

    return;

  let total = 0; const inv = [];
  for (const p of searching) {

    total += n; if (p.peer !== me) inv.push(p.peer);

  total = Math.max(total, Math.max(1, partyPeers().length));
  $('searchText').textContent = t('searching', { s: Math.max(0, Math.ceil((SEARCH_WAIT - waited) / 1000)), n: total, m: MAX_PLAYERS });
  if (total >= MAX_PLAYERS || waited >= SEARCH_WAIT) {

// El anfitrión espera a los invitados (máx. 5 s) y reparte los puestos; los demás esperan esa lista
function assembleTick() {

  if (NET.isHost) {

    if (peers.length >= NET.expected || Date.now() - NET.assembleStart > ASSEMBLE_WAIT) {
      const humans = [...peers].sort((a, b) => (isMine(b) - isMine(a)) || (a.peer < b.peer ? -1 : 1)).slice(0, MAX_PLAYERS);
      NET.roster = humans.map(p => [p.peer, String(p.presence.nick).slice(0, 14)]);
      NET.botNames = [...BOT_NAMES].sort(() => Math.random() - 0.5).slice(0, MAX_PLAYERS - NET.roster.length);
      setupMatch(NET.roster, NET.botNames);

    }

  if (NET.isHost) Object.assign(pres, {

  NET.hostSeen = Date.now();

  if (hp === NET.lastHostPres) return;

// ================== CÁMARA ==================
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3(), tmpV = new THREE.Vector3();

function updateCamera(dt) {
  if (player.alive) {

    const g = player.grounded ? 1 : 0;
    const sway = g * Math.sin(player.phase) * 0.025 * run;

    camera.position.set(tmpV.x + fx * fo + rx * sway, tmpV.y + dipY, tmpV.z + fz * fo + rz * sway);
    const lat = (player.vel.x * rx + player.vel.z * rz) / CFG.speed;

    const falling = !player.grounded && player.vel.y < -8;
    const targetFov = CFG.fov + run * 4 + (falling ? 14 : 0) + (player.boost > 0 ? 5 : 0);
    if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-5 * dt)); camera.updateProjectionMatrix(); }
    viewFloor = player.landFloor;
    if (windGain) {
      const w = Math.min(0.2, Math.max(0, -player.vel.y - 4) * 0.012);
      windGain.gain.setTargetAtTime(w, actx.currentTime, 0.15);
      windGain.userData.frequency.setTargetAtTime(500 + Math.max(0, -player.vel.y) * 30, actx.currentTime, 0.2);
    }
  } else {
    // Espectador: vista desde fuera del jugador más alto que sigue en pie
    const focus = runners.filter(r => r.alive).sort((a, b) => a.floor - b.floor)[0] || player;
    camTarget.lerp(tmpV.set(focus.pos.x, focus.pos.y + 1.2, focus.pos.z), 1 - Math.exp(-6 * dt));
    if (!keys.ArrowLeft && !keys.ArrowRight && !dragging) yaw += dt * 0.15;

    camera.lookAt(camTarget);
    if (Math.abs(camera.fov - CFG.fov) > 0.05) { camera.fov += (CFG.fov - camera.fov) * 0.1; camera.updateProjectionMatrix(); }
    viewFloor = focus.landFloor;
    if (windGain) windGain.gain.setTargetAtTime(0, actx.currentTime, 0.3);
  }
}

const clock = new THREE.Clock();

}

      if (countdown <= 0) startPlay();
    } else if (state === 'play') elapsed += dt;
    const moving = state !== 'countdown';

      if (!fallSoundPlayed && player.pos.y < floorTop(CFG.floors - 1) - 2) { fallSoundPlayed = true; sfx.fall(); }
    }
    jumpPressed = false;

    for (const r of runners) {
      if (r === player || !r.alive) continue;
      if (r.kind === 'bot') {
        const [dx, dz] = moving ? botBrain(r, dt) : [0, 0];
        stepRunner(r, dt, dx, dz, state === 'play');
      } else stepRemote(r, dt, state === 'play');

      if (runners.filter(r => r.alive).length <= 1) endMatch();
    }

    updateTiles(dt);
    updateParticles(dt);
    updateCamera(dt);
    updateWorld(dt);
    updateHud();
  } else {
    // Menú: cámara girando alrededor de la arena
    const tm = performance.now() * 0.00006;
    camera.position.set(Math.sin(tm) * 20, 6, Math.cos(tm) * 20);
    camera.lookAt(0, -3, 0);
    updateTiles(dt); updateParticles(dt); updateWorld(dt);
  }
}
applyLang();
buildFloors();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
// Gancho de pruebas: simula n pasos sin renderizar
window.__game = {
  get state() { return state; }, get runners() { return runners; }, get player() { return player; }, get net() { return NET; },
  tick(n, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  look(y, p) { yaw = y; pitch = p; },
};
</script>
</body>
</html>
